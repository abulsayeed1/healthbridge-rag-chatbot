# HealthBridge eval harness config (Member 3).
# All keys optional — anything omitted falls back to the defaults in run_eval.py.
#
# The defaults below are the OFFLINE-SAFE profile (small, commonly cached models) so the
# harness runs on any machine. For the Sunday production run against v-final, switch to the
# proposal models by uncommenting the overrides at the bottom (expect ~1GB+ downloads).

# --- offline-safe defaults -------------------------------------------------
embedding_model: sentence-transformers/all-MiniLM-L6-v2
embedding_query_prefix: ""
rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2

# --- production overrides (uncomment for the v-final run) ------------------
# embedding_model: BAAI/bge-base-en-v1.5
# embedding_query_prefix: "Represent this sentence for searching relevant passages: "
# rerank_model: BAAI/bge-reranker-base

pool_size: 30
top_k: 5
rrf_k: 60
chunk_tokens: 256
chunk_overlap: 50
tau: 0.5
split_seed: 633
bootstrap_n: 10000
bootstrap_seed: 633
